name: Debug build + installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact_name: app_debug_x64
          - runner: windows-11-arm64
            artifact_name: app_debug_a64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze

      - name: Build executable with cx_Freeze
        run: |
          python build.py build

      - name: Upload cx_Freeze Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/app_debug/**

      - name: Compile Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: install.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}_installer
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze

      - name: Build executable with cx_Freeze
        run: |
          python build.py build

      - name: Package into .deb using dpkg-deb
        run: |
          # 1. Tạo cấu trúc thư mục tiêu chuẩn cho .deb
          mkdir -p deb_dist/opt/mazult-launcher
          mkdir -p deb_dist/DEBIAN
          mkdir -p deb_dist/usr/share/applications

          # 2. Sao chép ứng dụng đã build vào /opt/mazult-launcher
          cp -r dist/app_debug/* deb_dist/opt/mazult-launcher/

          # 3. Tạo file cấu hình DEBIAN/control
          cat << 'EOF' > deb_dist/DEBIAN/control
          Package: mazult-launcher
          Version: 1.8.5.2026
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: LunarMoonDLCT
          Description: MaZult Launcher
          EOF

          # 4. Tạo file .desktop để tích hợp Menu ứng dụng trên Linux
          cat << 'EOF' > deb_dist/usr/share/applications/mazult-launcher.desktop
          [Desktop Entry]
          Name=MaZult Launcher
          Exec=/opt/mazult-launcher/Launcher
          Icon=/opt/mazult-launcher/icon.ico
          Type=Application
          Categories=Game;
          EOF

          # 5. Cấp quyền và đóng gói thành .deb
          chmod -R 755 deb_dist/DEBIAN
          chmod -R 755 deb_dist/opt/mazult-launcher
          dpkg-deb --build deb_dist dist/MaZult-Launcher-1.8.5.2026-amd64.deb

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app_debug_linux_deb
          path: dist/*.deb
